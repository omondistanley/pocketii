name: Ruff autofix redesign

on:
  push:
    branches: [redesign]
    paths:
      - ".github/workflows/ruff-autofix-redesign.yml"

permissions:
  contents: write

jobs:
  fix:
    name: Apply scoped Ruff fixes
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix receipt table scope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("expense-microservice/app/services/expense_data_service.py")
          text = path.read_text()
          anchor = 'EXPENSE_TAG_TABLE = "expense_tag"\n'
          module_decl = 'RECEIPT_TABLE = "receipt"\n'
          class_decl = '    # --- Receipts (metadata; file storage is external) ---\n    RECEIPT_TABLE = "receipt"\n'
          class_replacement = '    # --- Receipts (metadata; file storage is external) ---\n'
          if module_decl not in text.split("class ExpenseDataService", 1)[0]:
              text = text.replace(anchor, anchor + module_decl, 1)
          text = text.replace(class_decl, class_replacement, 1)
          path.write_text(text)
          PY
      - name: Apply Ruff safe fixes
        run: |
          python -m pip install ruff==0.15.21
          ruff check user-microservice/app budget-microservice/app expense-microservice/app investments-microservice/app --fix
      - name: Confirm lint is clean
        run: |
          ruff check user-microservice/app budget-microservice/app expense-microservice/app investments-microservice/app
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add user-microservice/app budget-microservice/app expense-microservice/app investments-microservice/app
          if git diff --cached --quiet; then
            echo "No Ruff fixes required"
          else
            git commit -m "Fix backend Ruff errors"
            git push origin HEAD:redesign
          fi
