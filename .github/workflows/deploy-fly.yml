name: Deploy Pocketii to Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pocketii-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Pocketii
        run: flyctl deploy --remote-only --app pocketii --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
