name: Patch CI PostgreSQL strict mode

on:
  push:
    branches: [redesign]
    paths:
      - ".github/workflows/ci-diagnostics-redesign.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - name: Replace invalid psql flag and clean diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text()
          if "--on-error-stop" not in text:
              raise SystemExit("Expected invalid psql flag was not found")
          ci.write_text(text.replace(" --on-error-stop", " -v ON_ERROR_STOP=1"))
          PY
          rm -f .github/migration-missing.txt .github/user-migration-failure.txt .github/user-migration-after-fix.txt
          rm -f .github/workflows/ci-diagnostics-redesign.yml
      - name: Commit CI correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PostgreSQL migration commands in CI"
          git push origin HEAD:redesign
