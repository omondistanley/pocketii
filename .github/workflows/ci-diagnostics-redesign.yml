name: Fix migration pipeline

on:
  push:
    branches: [redesign]
    paths:
      - ".github/workflows/ci-diagnostics-redesign.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: users_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0
      - name: Correct release manifest and PostgreSQL strict mode
        run: |
          python - <<'PY'
          from pathlib import Path

          release = Path("deploy/release.sh")
          text = release.read_text()
          missing = "         /opt/expense_tracker/user-microservice/migrations/012_user_settings_preferences.sql \\\n"
          anchor = "         /opt/expense_tracker/user-microservice/migrations/012_report_saved_view.sql \\\n"
          if "012_user_settings_preferences.sql" not in text:
              text = text.replace(anchor, missing + anchor, 1)
          release.write_text(text)

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text().replace(" --on-error-stop", " -v ON_ERROR_STOP=1")
          ci.write_text(text)
          PY
      - name: Verify release migration coverage
        run: bash scripts/check_migrations_in_release.sh
      - name: Verify user migrations apply cleanly
        run: |
          cd user-microservice
          for f in migrations/create_user_table.sql migrations/0*.sql; do
            [ -f "$f" ] || continue
            echo "Applying $f"
            psql "postgresql://postgres:postgres@localhost:5434/users_db" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Remove diagnostic scaffolding and commit verified fix
        run: |
          rm -f .github/migration-missing.txt .github/user-migration-failure.txt
          rm -f .github/workflows/ci-diagnostics-redesign.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix migration safety and CI execution"
          git push origin HEAD:redesign
