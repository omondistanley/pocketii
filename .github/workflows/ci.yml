name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend-css:
    name: Build frontend CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm run build:css
      - name: Verify compiled file exists
        run: test -s frontend/static/css/app.tw.css

  frontend-ts:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, typecheck, build JS
        run: |
          cd frontend
          npm ci
          npm run typecheck
          npm run build:js
      - name: Verify emitted scripts
        run: test -s frontend/static/js/auth.js && test -s frontend/static/sw.js

  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - expense-microservice
          - investments-microservice
          - user-microservice
          - budget-microservice
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install Ruff
        run: pip install ruff==0.15.21
      - name: Run Ruff
        run: ruff check ${{ matrix.service }}/app/ --output-format=github

  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: expense-microservice
            db_name: expenses_db
            migrations: all
          - service: investments-microservice
            db_name: investments_db
            migrations: all
          - service: user-microservice
            db_name: users_db
            migrations: user
          - service: budget-microservice
            db_name: budgets_db
            migrations: none
          - service: api-gateway
            db_name: gateway_test_db
            migrations: none
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.db_name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ${{ matrix.db_name }}
      SECRET_KEY: ci-test-secret-key-32-bytes-long!
      ENCRYPTION_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: |
          cd "${{ matrix.service }}"
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Apply migrations
        if: matrix.migrations != 'none'
        run: |
          cd "${{ matrix.service }}"
          if [ "${{ matrix.migrations }}" = "user" ]; then
            for f in migrations/create_user_table.sql migrations/0*.sql; do
              [ -f "$f" ] || continue
              echo "Applying $f"
              psql "postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }}" -v ON_ERROR_STOP=1 -f "$f"
            done
          else
            for f in migrations/*.sql; do
              [ -f "$f" ] || continue
              echo "Applying $f"
              psql "postgresql://postgres:postgres@localhost:5432/${{ matrix.db_name }}" -v ON_ERROR_STOP=1 -f "$f"
            done
          fi
      - name: Run tests
        run: |
          cd "${{ matrix.service }}"
          python -m pytest tests/ -v --tb=short

  migration-check:
    name: Migration safety check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Check migration file ordering
        run: |
          echo "Checking expense migrations are sequentially numbered..."
          last=0
          for f in expense-microservice/migrations/*.sql; do
            num=$(basename "$f" | grep -oE '^[0-9]+')
            if [ -n "$num" ]; then
              if [ "$num" -le "$last" ]; then
                echo "ERROR: out-of-order or duplicate migration: $f (previous=$last)"
                exit 1
              fi
              last=$num
            fi
          done
          echo "Expense migrations OK (last=$last)"

          echo "Checking investment migrations are sequentially numbered..."
          last=0
          for f in investments-microservice/migrations/*.sql; do
            num=$(basename "$f" | grep -oE '^[0-9]+')
            if [ -n "$num" ]; then
              if [ "$num" -le "$last" ]; then
                echo "ERROR: out-of-order or duplicate migration: $f (previous=$last)"
                exit 1
              fi
              last=$num
            fi
          done
          echo "Investment migrations OK (last=$last)"
      - name: Verify release script lists every migration
        run: bash scripts/check_migrations_in_release.sh
