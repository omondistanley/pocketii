name: Refresh mobile lockfile

on:
  push:
    branches: [redesign]
    paths:
      - "mobile/package.json"
      - ".github/workflows/mobile-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    name: Regenerate mobile package lock
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Regenerate package-lock.json
        run: |
          cd mobile
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "Refresh mobile lockfile"
            git push origin HEAD:redesign
          fi
